<!DOCTYPE html>
<html>

<head>
    <title>GET STARTED</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
    <form method="post">

        <h1>Create your account</h1>
        <p>Join us in a couple of steps.</p>

        <div class="field">
            <label for="fname">Full Name</label><br>
            <input type="text" id="fname" placeholder="Jane Deo">
        </div>

        <div class="field">
            <label for="age">Age</label><br>
            <input type ="number" id ="age">
            
        </div>

        <div class="field">
            <label for="date">Date of Birth</label><br>
            <input type="date" id="date">
        </div>

        <div class="field">
            <label for="mail">Email address</label><br>
            <input type="email" id="mail" placeholder="jane@example.com">
        </div>

        <div class="field">
            <label for="pass">Password</label><br>
            <input type="password" id="pass" placeholder="At least 8 characters">
        </div>

        <div class="rdio">
            <label for="contact">Preferred contact</label><br>
            <input type="radio" name="contact" value="email">Email
            <input type="radio" name="contact" value="phone">Phone
            <input type="radio" name="contact" value="sms">SMS

        </div>

        <br>

        <div class="btn">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>
    </div>

</body>
<script src ="script.js"></script>

</html>
