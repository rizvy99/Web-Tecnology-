<!DOCTYPE html>
<html>

<head>
    <title>GET STARTED</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form method="post">

        <h1>Create your workspace</h1>

        <div class="field">
            <label for="fname">Full Name</label><br>
            <input type="text" id="fname" placeholder="Jane Deo" name = "fname">
        </div>

        <div class="field">
            <label for="nmbr">Phone number</label><br>
            <input type="number" id ="nmbr" name = "nmbr">
             
        </div>

        <div class="field">
            <label for="date">Date of Birth</label><br>
            <input type="date" id="date" name="date">
        </div>

        <div class="field">
            <label for="mail">Work email</label><br>
            <input type="email" id="mail" placeholder="jane@example.com" name="mail">
        </div>

        <div class="field">
            <label for="pass">Password</label><br>
            <input type="password" id="pass" placeholder="At least 8 characters" name="pass">
        </div>

        <div class="check">
            <input type="checkbox" name="RB" value="rb">Email me product updates and tips
            <br>
            <input type="checkbox" name="PP" value="pp">I agree to the Terms & Privacy Policy
        </div>

        <br>

        <div class="btn">
            <input type="submit" value="Create workspace">
            <input type="reset" value="Reset">
        </div>

    </form>
    </div>

    <script src="script.js"></script>

</body>

</html>
